                        type: object
                        properties:
                          updated:
                            type: array
                            items:
                              type: object
                              properties:
                                item_id: { type: string, format: uuid }
                                old_sale_unit_price: { type: string }
                                new_sale_unit_price: { type: string }
                          quote_totals: { $ref: '#/components/schemas/QuoteTotals' }
        '409':
          description: 40905 QUOTE_NOT_EDITABLE，或未设置 target_margin_rate（400）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /quotes/{id}/refresh-prices:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [quotes]
      summary: 草稿态批量同步最新价（唯一允许改写已落表快照的操作）— 仅 admin
      description: |
        权限：`canOverridePrice(role)`，**仅 admin**。它批量改金额，风险等级与改价相同。

        七条不变量（违反任何一条即 bug，PM 的 3B/3C 组 TC 以此为依据）：
        1. `status <> 'draft'` → 409 40905，零行被改写；
        2. **只改成本相关列，`sale_unit_price` 一律不动**（对客价是商务判断，刷新成本顺手改售价等于系统替用户降价）；
        3. 每一行被改写必须写 `price_change_logs`（change_kind=refresh，含 old/new/changed_by/changed_at）；
        4. `dry_run=true` 只返回差异清单不落库，`dry_run=false` 才写。**先给数，再落库**（与切口径试算同一模式）；
        5. `cost_source='manual'` 的行默认跳过（skipped 带 reason=manual_cost），除非显式 `include_manual=true`；
        6. 新价找不到时**不清空旧值**，进 skipped（reason=no_valid_price），按 §6.2.7 缺价规则处理；
        7. **幂等**：连点两次，第二次 `updated` 必须为空数组；
        8. **预览必须诚实**：`dry_run=true` 的差异清单必须与随后 `dry_run=false` 的实际写入逐行一致。
           试算说会改 3 行、真跑改了 2 行，这个预览就是在骗人，而用户正是拿它做决定。
           实现上用 `preview_matches_write` 回显比对结果（不引入 preview_token，两段式事务不在 MVP 范围）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dry_run]
              properties:
                item_ids:
                  type: array
                  items: { type: string, format: uuid }
                  description: 不传表示全单
                dry_run:
                  type: boolean
                  description: |
                    **必传，无默认值**（ARCHITECTURE §6.9 判据）：给它默认值就是替用户决定"要不要真的改金额"。
                    true = 只返回差异清单；false = 落库。
                include_manual:
                  type: boolean
                  description: 是否也刷新 cost_source=manual 的行。默认 false，传 true 表示用户明确要覆盖手填值
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          updated:
                            type: array
                            items:
                              type: object
                              properties:
                                item_id: { type: string, format: uuid }
                                item_name_snapshot: { type: string }
                                old_cost_unit_price: { type: string }
                                new_cost_unit_price: { type: string }
                          skipped:
                            type: array
                            items:
                              type: object
                              properties:
                                item_id: { type: string, format: uuid }
                                item_name_snapshot: { type: string, nullable: true }
                                reason:
                                  type: string
                                  enum: [manual_cost, no_valid_price, unchanged, not_found]
                          dry_run: { type: boolean, description: 回显本次是否为试算；true 时 updated 里的值尚未落库 }
                          affected_manual_count:
                            type: integer
                            description: |
                              本次会被改写的 `cost_source='manual'` 行数（`include_manual=true` 时才可能 > 0）。
                              必须返回：手填成本往往是用户刚跟供应商口头确认过的价，静默覆盖等于用库里的旧价
                              打败刚问到的新价。所以前端在 `include_manual=true` 时要用这个数做二次确认。
                          preview_matches_write:
                            type: boolean
                            description: |
                              `dry_run=false` 时，回显"本次实际写入"是否与上一次同参数 `dry_run=true` 的预览完全一致。
                              false 表示预览与写入之间价被别人改过（TOCTOU）——**必须提示用户重看差异，不得静默接受**。
                              注意这是**检测**而不是**防止**：本端点不提供 preview_token，
                              两段式事务不在 MVP 范围（见 OPEN-DECISIONS）。检测的成本是一次比对，收益是
                              "试算说改 3 行、真跑改了 2 行"这种骗人的预览不会悄悄发生。
        '409':
          description: 40905 QUOTE_NOT_EDITABLE — 只有 draft 可同步
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /quotes/{id}/recalculate:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [quotes]
      summary: 重算全部汇总（数据自洽性检查）
      description: |
        按恒等式 `line_price = round(qty × sale_unit_price, 2)` 重算每一行，再重算总表。
        若重算结果与库里已有值不一致，在 `warnings` 中报告（说明某处写入绕过了 service 层），不静默修复。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/QuoteDetail'
                          - type: object
                            properties:
                              warnings:
                                type: array
                                items: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }

  /quotes/{id}/issue:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [quotes]
      summary: 发出报价单（draft → issued，此后行金额只读）
      description: |
        发出前服务端强制跑一次风险检查（同 `/risk-check`），结果写入 `note` 审计。
        无明细行时返回 40906。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/QuoteDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            40906 QUOTE_EMPTY — 没有明细行，不可发出。
            40907 INVALID_TRANSITION — 当前状态不允许该流转。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /quotes/{id}/void:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [quotes]
      summary: 作废报价单（→ void，记录保留用于台账）
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 200 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/QuoteDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 40907 INVALID_TRANSITION
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /quotes/{id}/new-version:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [quotes]
      summary: 改版重报（复制为 version+1 的新草稿，旧版本冻结不覆盖）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [copy_items]
              properties:
                copy_items:
                  type: boolean
                  description: true 时连明细行一起复制；false 只复制抬头信息
      responses:
        '201':
          description: 已创建新版本草稿
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/QuoteDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 源报价单仍是 draft（草稿应直接编辑，不需要改版）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /quotes/{id}/risk-check:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [quotes]
      summary: 发送前自检（8 条规则，不阻断流转，只返回清单）
      description: |
        只有 customer_name / event_name 为空是 blocker；其余 7 条为 warning。
        做成 POST 是因为它要读取当前 settings 阈值并可能记录一次检查，语义上不是幂等 GET 的缓存对象。
        - R1 整单毛利率低于阈值（app_settings.default_margin_threshold，默认 0.25）
        - R2 存在成本手填的行（price_missing=true）
        - R3 存在成本单价高于该主体当前最低有效价的行
        - R4 客户名或活动名为空（blocker）
        - R5 本单引用了软陈旧价格（staleness_days > 阈值）
        - R6 引用的价格在报价有效期内就失效
        - R7 亏损行
        - R8 零价行
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RiskCheckResult' }
        '404': { $ref: '#/components/responses/NotFound' }

  /quotes/{id}/tax-basis/preview:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [quotes]
      summary: 切换税口径的试算（只读，零副作用）
      description: |
        PRD v1.7 §6.6.9.2：用户点确认之前，必须看到切换前后的整单合计。

        **零副作用**：不落库、不改 `last_used_at`、不写 `price_change_logs`、不触发通知。
        **算术只有一份**：内部必须调用与 `POST /quotes/{id}/issue` / `/recalculate` 同一个
        `recalcQuoteTotals()`，并用 `planTaxBasisSwitch()` 跑 `resolvePrice` 的另一口径——
        禁止在这里另写一遍求和或另写一遍取价。

        **缺价行规则**（不变量）：新口径下查不到价的行，
        `sale_unit_price` 保持原值（对客价是商务判断，不因数据缺失被清掉），
        `cost_unit_price` 保留旧值 + `price_missing` 置 true + `cost_source` 转 `manual` + `price_id` 置 NULL；
        该行仍以**原对客价**计入 `summary.total_after`。
        否则提示里给的新合计与实际发出的单不一致。

        两条反例断言（vitest 4C 组必须红）：
        提示只说"成本会变" → 判错（自动定价行的对客价也变，合计会变）；
        提示说"金额不变" → 判错（total_before != total_after 是常见结果）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaxBasisPreviewRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TaxBasisPreviewResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 40905 QUOTE_NOT_EDITABLE — 已发出/已作废的报价单不能切口径
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /quotes/{id}/export.xlsx:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [quotes]
      summary: 导出报价单 Excel
      description: |
        `view=customer`（默认）任何登录用户可调；**`view=internal` 仅 admin，member 调用返回 403 `40302`**
        （PRD §11.3：屏幕可见是即时行为，导出文件是可转发资产）。
        客户版**由服务端剔除成本字段**，并在下发前做自检断言：成本/毛利/加价/cost/profit/margin 在文件中的命中数必须为 0，否则 500 中止。
        客户版与内部版**不共用列定义**（独立 DTO），不允许用 `hideCost` flag 的做法。
      parameters:
        - name: view
          in: query
          description: customer（默认，不含任何成本列，且过滤 is_visible_to_customer=false 的行）/ internal（含成本、毛利、供应商）
          schema: { type: string, enum: [customer, internal], default: customer }
      responses:
        '200':
          description: xlsx 二进制流
          headers:
            Content-Disposition:
              schema: { type: string }
              description: attachment; filename="Q261104-01_v1.xlsx"
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '403':
          description: 40302 INTERNAL_EXPORT_FORBIDDEN — member 调用 view=internal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }

