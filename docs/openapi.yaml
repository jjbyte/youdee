    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [notifications]
      summary: 标记已读
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Notification' }
        '404': { $ref: '#/components/responses/NotFound' }

  /notifications/read-all:
    post:
      tags: [notifications]
      summary: 全部标为已读
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          updated: { type: integer }

  /health:
    get:
      tags: [system]
      summary: 健康检查（含数据库连通）
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status: { type: string, enum: [ok] }
                          db: { type: string, enum: [ok, error] }
                          version: { type: string }
                          uptime_s: { type: integer }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: rc_session
      description: 登录后由服务端写入的 httpOnly JWT Cookie

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Sort:
      name: sort
      in: query
      schema: { type: string }
      description: 字段名，必须在服务端白名单内，否则回落到默认排序
    Order:
      name: order
      in: query
      schema: { type: string, enum: [asc, desc], default: asc }

  responses:
    OkNull:
      description: 成功，data 为 null
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    BadRequest:
      description: 40001 VALIDATION_ERROR — 参数校验失败
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: |
        40101 UNAUTHENTICATED — 未登录 / 令牌无效 / 已过期
        40102 TOKEN_REVOKED — 账号已停用或 token_version 不匹配
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: 40301 FORBIDDEN — 权限不足（如 member 尝试写价格）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: 40401 NOT_FOUND
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: |
        40901 DUPLICATE — 名称 / 编码 / 单号重复
        40902 PRICE_PERIOD_OVERLAP — 价格生效期间重叠
        40903 PRICE_IMMUTABLE — 价格记录不可就地修改
        40904 RESOURCE_IN_USE — 被引用，无法删除
        40905 QUOTE_NOT_EDITABLE — 报价单当前状态不可编辑
        40906 QUOTE_EMPTY — 报价单无明细不可发出
        40907 INVALID_TRANSITION — 状态流转非法
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    RateLimited:
      description: 42901 RATE_LIMITED — 登录失败次数过多
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  schemas:
    Envelope:
      type: object
      required: [code, data, message]
      properties:
        code: { type: integer, example: 0 }
        data: { nullable: true }
        message: { type: string, example: '' }

    ErrorEnvelope:
      type: object
      required: [code, data, message]
      properties:
        code: { type: integer, example: 40902 }
        data: { nullable: true, example: null }
        message: { type: string, example: 该供应商在此生效期间已有此主体的价格 }
        field: { type: string, nullable: true, example: effective_from }
        proposed_close:
          type: object
          nullable: true
          description: 仅 40902 返回。前端据此弹出「将结束旧价」确认
          properties:
            price_id: { type: string, format: uuid }
            supplier_name: { type: string }
            close_effective_to:
              type: string
              format: date
              description: 旧价应被设为的失效日（= 新价生效日 - 1 天）
            current_effective_to: { type: string, format: date, nullable: true }

    Pagination:
      type: object
      properties:
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
        hasMore: { type: boolean }

    Unit:
      type: object
      properties:
        code: { type: string, example: sqm }
        name: { type: string, example: 平方米 }
        kind: { type: string, enum: [quantity, area, length, time] }
        sort_order: { type: integer }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        role: { type: string, enum: [admin, member] }
        is_active: { type: boolean }
        last_login_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    CurrentUser:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        display_name: { type: string }
        role: { type: string, enum: [admin, member] }
        last_login_at: { type: string, format: date-time, nullable: true }

    SupplierInput:
      type: object
      required: [name, type]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        type: { type: string, enum: [online, factory, rental, freelancer, internal] }
        contact_name: { type: string, nullable: true, maxLength: 30 }
        contact_phone: { type: string, nullable: true, maxLength: 30 }
        shop_url: { type: string, nullable: true, maxLength: 500, description: 店铺/主页链接，online 类型尤其重要 }
        region: { type: string, nullable: true, maxLength: 50 }
        default_lead_time_days: { type: integer, nullable: true, minimum: 0, maximum: 365 }
        note: { type: string, nullable: true, maxLength: 500 }
        is_active: { type: boolean, default: true }

    Supplier:
      allOf:
        - $ref: '#/components/schemas/SupplierInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }

    Category:
      type: object
      properties:
        id: { type: string, format: uuid }
        domain: { type: string, enum: [material, personnel] }
        parent_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        sort_order: { type: integer }
        default_pricing_nature:
          type: string
          enum: [purchase, rental_per_day, custom_made]
          nullable: true
          description: 本节点自身的预填值（可能为 null）。前端若要预填录价表单，请用 effective_pricing_nature
        effective_pricing_nature:
          allOf:
            - $ref: '#/components/schemas/PricingNature'
          description: |
            服务端解析好的最终预填值 = COALESCE(本节点, 父节点, 'purchase')。
            **前端直接用这个，不要自己上溯**——上溯逻辑写两遍就会出现"分类页显示租赁、录价表单显示买断"。

    CategoryNode:
      allOf:
        - $ref: '#/components/schemas/Category'
        - type: object
          properties:
            item_count: { type: integer }
            children:
              type: array
              items: { $ref: '#/components/schemas/CategoryNode' }

    ItemInput:
      type: object
      required: [item_type, category_id, name, base_unit_code]
      properties:
        item_type: { type: string, enum: [material, personnel] }
        category_id:
          type: string
          format: uuid
          description: 其 domain 必须与 item_type 一致（material 对应 material，personnel 对应 personnel）
        name: { type: string, minLength: 1, maxLength: 80 }
        spec: { type: string, nullable: true, maxLength: 200 }
        base_unit_code:
          type: string
          description: 基准单位。已有价格记录后不可修改（42204）
          example: sqm
        compare_unit_code:
          type: string
          nullable: true
          description: |
            比价基准单位。只在同一主体下各供应商单位不一致时才需要填。
            不填 = 不折算，各行按自身单位比（跨单位行 compare_state=not_comparable）。
          example: sqm
        code: { type: string, nullable: true, maxLength: 40, description: 物料内部编码（item_type=material 常用） }
        aliases:
          type: array
          nullable: true
          items: { type: string }
          description: 别名（P2 预留，MVP 搜索不使用）
        employment_type:
          type: string
          nullable: true
          enum: [internal_staff, external_expert, external_parttime]
          description: 仅 personnel：自有管理人员 / 外聘专家 / 外聘兼职。material 必须为 null
        includes_travel:
          type: boolean
          nullable: true
          description: 仅 personnel：该主体单价是否含差旅。不可派生，落库
        phone: { type: string, nullable: true, maxLength: 30, description: 仅 personnel }
        note: { type: string, nullable: true, maxLength: 500 }
        is_active: { type: boolean, default: true }

    PricingMode:
      type: string
      enum: [per_day, per_event, per_person_day, per_hour, per_half_day]
      description: |
        仅 personnel，**派生只读**：由 base_unit_code 双射推出（day→per_day, session→per_event,
        person_day→per_person_day, hour→per_hour, half_day→per_half_day）。不落库，避免与 base_unit_code 不一致。

    Item:
      allOf:
        - $ref: '#/components/schemas/ItemInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            base_unit_name: { type: string, nullable: true }
            compare_unit_name: { type: string, nullable: true }
            pricing_mode:
              type: string
              enum: [per_day, per_event, per_person_day, per_hour, per_half_day]
              nullable: true
              readOnly: true
              description: 仅 personnel 的派生字段；material 恒为 null
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }

    ItemLite:
      type: object
      properties:
        id: { type: string, format: uuid }
        item_type: { type: string, enum: [material, personnel] }
        name: { type: string }
        spec: { type: string, nullable: true }
        base_unit_code: { type: string }
        base_unit_name: { type: string }
        first_image_url: { type: string, nullable: true }

    ItemListItem:
      allOf:
        - $ref: '#/components/schemas/ItemLite'
        - type: object
          properties:
            category_id: { type: string, format: uuid }
            category_name: { type: string }
            is_active: { type: boolean }
            price_supplier_count: { type: integer }
            lowest_summary:
              $ref: '#/components/schemas/LowestSummary'

    LowestSummary:
      type: object
      description: |
        列表/搜索/勾选侧栏的最低报价摘要。**存在多个分组时不返回标量**——
        列表页没有 Tab、没有上下文，用户扫一眼「最低 ¥380」就记住了，是"全站最容易造成错单的一格"。
        由后端判定 is_multi_group，前端只在 false 时允许渲染裸数字。
      required: [is_multi_group, groups]
      properties:
        is_multi_group:
          type: boolean
          description: true 时 groups 长度 > 1，前端必须渲染为多行「租赁 ¥380/天 · 买断 ¥8,000/块」，禁止取 groups[0]
        groups:
          type: array
          description: 按 (pricing_nature, pricing_mode) 分组，各自的最低价；为空表示该主体暂无有效价
          items:
            type: object
            properties:
              pricing_nature: { $ref: '#/components/schemas/PricingNature' }
              pricing_mode:
                type: string
                enum: [per_day, per_event, per_person_day, per_hour, per_half_day]
                nullable: true
              group_lowest:
                type: string
                nullable: true
                description: 该组内已折算到比价基准单位的最低价
              unit_code: { type: string, description: 该组最低价对应的计价单位，前端用于拼「¥380/天」 }
              supplier_id: { type: string, format: uuid, nullable: true }
              supplier_name: { type: string, nullable: true }
              supplier_type: { type: string, nullable: true, enum: [online, factory, rental, freelancer, internal] }

    ItemDetail:
      allOf:
        - $ref: '#/components/schemas/Item'
        - type: object
          properties:
            base_unit_name: { type: string }
            category_path:
              type: array
              items: { $ref: '#/components/schemas/Category' }
            images:
              type: array
              items: { $ref: '#/components/schemas/Attachment' }
            links:
              type: array
              items: { $ref: '#/components/schemas/ItemLink' }
            price_summary:
              type: object
              properties:
                supplier_count: { type: integer }
                lowest_summary: { $ref: '#/components/schemas/LowestSummary' }
                latest_updated_at: { type: string, format: date-time, nullable: true }

    Attachment:
      type: object
      properties:
        id: { type: string, format: uuid }
        storage_key: { type: string, description: 相对路径，前端拼 /uploads/ 前缀 }
        thumb_key: { type: string, nullable: true }
        url: { type: string, description: 服务端拼好的可访问 URL }
        thumb_url: { type: string, nullable: true }
        original_name: { type: string }
        mime: { type: string, description: 'image/jpeg | image/png | image/webp | application/pdf' }
        size_bytes: { type: integer }
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
        sort_order: { type: integer }
        note: { type: string, nullable: true }

    ItemLink:
      type: object
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        url: { type: string }
        platform: { type: string, enum: [taobao, alibaba, offline, other], nullable: true }
        note: { type: string, nullable: true }
        sort_order: { type: integer }

    PriceTier:
      type: object
      required: [min_qty, unit_price]
      properties:
        min_qty:
          type: string
          description: 档位起点（含），以**本价格的计价单位**计
          example: '50.000'
        unit_price:
          type: string
          description: 档位单价，以**本价格的计价单位**计
          example: '4.2000'
        max_qty:
          type: string
          nullable: true
          readOnly: true
          description: 仅出参派生（下一档 min_qty - 1 / null 表示无上限），**入参忽略**——存下来必然与下一档漂移

    PriceInput:
      type: object
      required: [item_id, supplier_id, unit_code, pricing_nature, unit_price, effective_from]
      properties:
        item_id: { type: string, format: uuid }
        supplier_id: { type: string, format: uuid }
        unit_code:
          type: string
          description: 本价格的计价单位。与主体 compare_unit_code 不一致时可填 base_unit_qty 以支持折算
        base_unit_qty:
          type: string
          nullable: true
          description: |
            **选填**（录价表单只露 4 个必填：供应商/单价/生效日/单位，本字段折叠在「展开更多」里）。
            语义：1 个比价基准单位 = N 个本价格单位。喷绘布基准 ㎡、按张 12 张/㎡ → "12"。
            填了必须 > 0 且 ≠ 1（填 1 等于谎称单位一致，返回 42201）。留空则该行 compare_state=not_comparable，不参与标最低但仍可进单。
          example: '12'
        pricing_nature:
          allOf:
            - $ref: '#/components/schemas/PricingNature'
          description: |
            **必传，无默认值**（ARCHITECTURE §6.9 第 2 处）。
            物料：预填值来自 categories.default_pricing_nature（本节点 → 父节点 → purchase），用户可见可改。
            人员：**必须恒为 service，由服务端强制**；请求里传其它值返回 42201。
            该列 NOT NULL 且进 EXCLUDE 唯一键，**不得改为可空**——NULL 会让 WITH = 比较恒为假，约束对人员整段静默失效。
        unit_price:
          type: string
          description: 首档 / 基准档单价（以本价格计价单位计）。无阶梯时即唯一价
        currency: { type: string, default: CNY, maxLength: 3 }
        tax_included: { type: boolean, default: true, description: 只做标记，不做税额拆分；跨税口径不标最低价 }
        tax_rate: { type: string, nullable: true, description: 税率（%）。P1 才采集，MVP 可传 null 或省略 }
        moq: { type: string, nullable: true, description: 最小起订量，出单时校验 }
        effective_from: { type: string, format: date }
        effective_to:
          type: string
          format: date
          nullable: true
          description: 失效日，**含当天**。null = 长期有效
        source_note: { type: string, nullable: true, maxLength: 200, description: 报价来源，如「2026-10 老王微信问价」 }
        tiers:
          type: array
          description: 可选。空数组表示无阶梯，只用 unit_price
          items: { $ref: '#/components/schemas/PriceTier' }
        close_previous:
          type: boolean
          default: false
          description: |
            true 时在同一事务内把**当前有效记录**失效日设为「本条生效日 - 1 天」并置 superseded（标准调价流程）。

            **只读字段的服务端强制**（ARCHITECTURE §11.2 R19）：member 调本端点时，
            服务端用请求体的 `(item_id, supplier_id, pricing_nature, tax_included, unit_mode)` 定位将被关闭的旧记录，
            然后校验两件事，任一不满足 → 422 42207：
            1. **必须定位到恰好 1 条**当前有效记录（0 条说明他在用"换个供应商/换个性质"去关闭别人家的价）；
            2. **`base_unit_qty` 必须与旧记录一致**（不一致意味着换算结果变了，等于换了一个被比较的对象）。

            理由：R15 只允许成员改「这个供应商现在这个价是多少」，不允许改「这是谁家的什么价」。
            界面锁定是体验，**接口拒收才是权限边界**。

    Price:
      type: object
      properties:
        id: { type: string, format: uuid }
        item_id: { type: string, format: uuid }
        item_type: { type: string, enum: [material, personnel] }
        item_name: { type: string }
        item_spec: { type: string, nullable: true }
        base_unit_code: { type: string }
        base_unit_name: { type: string }
        supplier_id: { type: string, format: uuid }
        supplier_name: { type: string }
        supplier_type: { type: string, enum: [online, factory, rental, freelancer, internal] }
        unit_code: { type: string }
        base_unit_qty: { type: string, nullable: true }
        pricing_nature: { $ref: '#/components/schemas/PricingNature' }
        unit_mode:
          type: string
          enum: [per_day, per_event, per_person_day, per_hour, per_half_day]
          nullable: true
          readOnly: true
          description: |
            GENERATED 列：由 unit_code 派生（day→per_day, session→per_event, person_day→per_person_day, hour→per_hour, half_day→per_half_day，其余 null）。
            进 EXCLUDE 六元组唯一键，让「按场 2800」与「按天 1500」能并存。**只读，入参忽略**。
            注意与 items.pricing_mode 不同：后者是该主体的默认计价方式。
        unit_price: { type: string }
        currency: { type: string }
        tax_included: { type: boolean }
        tax_rate: { type: string, nullable: true }
        moq: { type: string, nullable: true }
        effective_from: { type: string, format: date }
        effective_to: { type: string, format: date, nullable: true }
        status: { type: string, enum: [active, superseded, archived] }
        effective_state: { $ref: '#/components/schemas/PriceEffectiveState' }
        staleness_days: { type: integer, description: 距 max(updated_at, last_used_at) 的天数；超过阈值即为软陈旧 }
        last_used_at: { type: string, format: date-time, nullable: true, description: 最近一次被 issued 报价单引用的时刻 }
        source_note: { type: string, nullable: true }
        tiers:
          type: array
          items: { $ref: '#/components/schemas/PriceTier' }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/Attachment' }
        created_by: { type: string, format: uuid, nullable: true }
        last_modified_by:
          type: string
          format: uuid
          nullable: true
          description: 最后修改人。只被"新建新版本价"这类改写动作更新，**last_used_at 回写不算修改**
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ExpiringPrice:
      type: object
      properties:
        price_id: { type: string, format: uuid }
        item_id: { type: string, format: uuid }
        item_type: { type: string, enum: [material, personnel] }
        item_name: { type: string }
        supplier_id: { type: string, format: uuid }
        supplier_name: { type: string }
        supplier_type: { type: string, enum: [online, factory, rental, freelancer, internal] }
        effective_to: { type: string, format: date, nullable: true }
        days_left: { type: integer, nullable: true, description: mode=expiring 时有值 }
        last_effective_at:
          type: string
          format: date-time
          description: mode=stale 时的计时起点 = GREATEST(updated_at, last_used_at)；被报价单用过即重置，避免"一直在用的价被报过期"
        staleness_days: { type: integer, description: 距上面那个时刻的天数 }

    PriceChangeLog:
      type: object
      properties:
        action: { type: string, enum: [created, superseded, archived, restored, note_updated] }
        changed_at: { type: string, format: date-time }
        changed_by_name: { type: string, nullable: true }
        snapshot: { type: object, description: 变更后完整状态（含 tiers） }
        prev_snapshot: { type: object, nullable: true }
        note: { type: string, nullable: true }

    PriceLookupResult:
      type: object
      properties:
        item_id: { type: string, format: uuid }
        item_type: { type: string, enum: [material, personnel] }
        item_name: { type: string }
        item_spec: { type: string, nullable: true }
        base_unit_code: { type: string }
        base_unit_name: { type: string }
        qty: { type: string, description: 请求数量（比价基准单位） }
        pricing_nature: { $ref: '#/components/schemas/PricingNature' }
        qty_priced: { type: string, description: 换算后的计价数量 = qty × COALESCE(base_unit_qty, 1)，据此选阶梯档 }
        on_date: { type: string, format: date }
        resolved_from:
          type: object
          properties:
            price_id: { type: string, format: uuid }
            supplier_id: { type: string, format: uuid }
            supplier_name: { type: string }
            supplier_type: { type: string, enum: [online, factory, rental, freelancer, internal] }
            unit_code: { type: string }
            base_unit_qty: { type: string, nullable: true, description: 1 个比价基准单位 = N 个本价格单位；null = 未填 }
            tier_min_qty: { type: string, nullable: true, description: 命中档位；null 表示用的是基准档价 }
            tier_unit_price: { type: string }
            tax_included: { type: boolean }
            effective_state: { $ref: '#/components/schemas/PriceEffectiveState' }
            staleness_days: { type: integer }
            moq: { type: string, nullable: true }
            effective_from: { type: string, format: date }
            effective_to: { type: string, format: date, nullable: true }
            source_note: { type: string, nullable: true }
        base_unit_price:
          type: string
          description: 折算后成本单价（元/比价基准单位）= tier_unit_price × COALESCE(base_unit_qty, 1)。拼单时直接填入 quote_items.cost_unit_price
        moq_warning: { type: boolean, description: qty 小于 moq 时为 true（不阻断，前端标黄） }
        tier_below_min: { type: boolean, description: qty 小于最小档位时为 true }

    PriceLookupMiss:
      type: object
      description: |
        `42205 PRICE_NOT_FOUND` 的错误体，也是 `other_basis_exists` / `other_basis_price`
        **唯一的返回位置**。200 分支（`PriceLookupResult`）不携带这两个字段——查到了本单口径的价，
        就不存在"另一口径"要提。前端拿到 422 后按 `other_basis_exists` 决定是否显示提示文案。

        提示文案（PRD v1.8 / Q7）：「该供应商只报了不含税价 ¥1,000，本单声明含税——请让供应商补报含税价，或手工填成本」。
        这一行的正确落法是 `price_missing=true` + `cost_source='manual'`，成本由人手填。
        **绝不把 `other_basis_price` 回填到 `cost_unit_price`**：含税单拿到不含税成本会让 24.7% 的毛利虚高成 33.3%，
        两个数都"看起来正常"，打标救不了它（TC-4.15b / 4.15c）。
      required: [code, data, message]
      properties:
        code: { type: integer, enum: [42205], example: 42205 }
        message:
          type: string
          example: 金桥桁架厂在含税口径下、2025-06-01 没有有效价格
        data:
          type: object
          required: [item_id, pricing_nature, tax_basis, on_date, other_basis_exists]
          properties:
            item_id: { type: string, format: uuid }
            supplier_id:
              type: string
              format: uuid
              nullable: true
              description: 请求指定了供应商则为该 ID；未指定（自动取该性质最低价）时为 null
            pricing_nature: { $ref: '#/components/schemas/PricingNature' }
            tax_basis:
              type: string
              enum: [inclusive, exclusive]
              description: 本单声明的口径，即"查不到价"的那个口径。前端回显用，不得据此自行换算另一口径
            on_date: { type: string, format: date }
            other_basis_exists:
              type: boolean
              description: 另一口径是否有价。为 false 时其余 `other_basis_*` 三字段均为 null
            other_basis_tax_included:
              type: boolean
              nullable: true
              description: |
                另一口径是含税还是不含税。提示文案要能说出「该供应商只报了**不含税**价 ¥X」，
                故显式返回，前端不得由 `tax_basis` 反推
            other_basis_price:
              type: string
              nullable: true
              description: |
                另一口径的单价，已归一化到比价基准单位。**仅用于提示文案**：
                不得写入 `cost_unit_price`，不得参与 `line_cost` / `line_price` / `line_profit` /
                整单合计 / 毛利 / 导出（TC-4.15c：用它替换成本后重算的合计若与真实合计相同，判定有人接了这条线）
            other_basis_price_id:
              type: string
              format: uuid
              nullable: true
              description: |
                另一口径那条价格的 ID。供前端提供「看这家别的口径」跳转，
                服务端不据此做任何金额计算

    CompareResult:
      type: object
      description: |
        比价结果按交易性质分组。三组分组键依次生效：pricing_nature → tax_included → compare_state。
        跨组绝不标最低；组内若税口径不一致则整组不可比。
      properties:
        item:
          type: object
          properties:
            id: { type: string, format: uuid }
            item_type: { type: string, enum: [material, personnel] }
            name: { type: string }
            base_unit_code: { type: string }
            base_unit_name: { type: string }
            compare_unit_code: { type: string, nullable: true, description: 为 null 时不折算，各行按自身单位呈现 }
            compare_unit_name: { type: string, nullable: true }
        qty: { type: string, description: 请求数量（比价基准单位） }
        on_date: { type: string, format: date }
        tier_breakpoints:
          type: array
          description: 全组阶梯 min_qty 的并集（升序去重）。前端数量档切换器的刻度来源，避免前端自行合并各家档位
          items: { type: number }
          example: [1, 50, 200]
        groups:
          type: array
          description: |
            分组键 = (pricing_nature, pricing_mode)。物料非时间类单位时 pricing_mode 为 null，等价于按 nature 分组；
            时间类单位（天/场/人天/小时/半天）与人员则自动细分。组内独立 is_lowest，跨组不比较，
            **不存在全局最低价字段**——留了早晚有人用。
          items:
            type: object
            required: [pricing_nature, comparable, rows]
            properties:
              pricing_nature: { $ref: '#/components/schemas/PricingNature' }
              pricing_nature_label: { type: string, example: 定制加工价 }
              pricing_mode:
                type: string
                enum: [per_day, per_event, per_person_day, per_hour, per_half_day]
                nullable: true
                description: |
                  该组的计价方式（由价格的 unit_code 派生）。
                  物料非时间类单位恒为 null（组即按 nature）；时间类单位与人员非 null（如 per_event / per_day）。
                  前端 Tab 与组标题用它，**不同 pricing_mode 的组绝不互相比较**。
              comparable:
                type: boolean
                description: false 时组内 is_lowest 全为 false，前端不得显示「最低」标记
              reason:
                type: string
                nullable: true
                enum: [MIXED_BASIS, ONLY_OTHER_BASIS, NO_COMPARABLE_UNIT, SINGLE_ROW, null]
                description: |
                  comparable=false 的原因。
                  MIXED_BASIS=组内口径混排且请求未指定口径（看 basis_dimension）；
                  ONLY_OTHER_BASIS=指定了口径，但部分供应商只报了另一口径（这些行仍在 rows 里，**不要当成"没报价"**）；
                  NO_COMPARABLE_UNIT=全部行单位不可折算；SINGLE_ROW=组内只有一行。
                  枚举里刻意不带 tax 字样：同一规则会复用到跨单位/跨性质/跨计价方式三种场景。
              basis_dimension:
                type: string
                nullable: true
                enum: [tax, unit, nature, pricing_mode, null]
                description: reason 为 MIXED_BASIS / ONLY_OTHER_BASIS 时，指出是哪一维口径不一致
              lowest_base_unit_price: { type: string, nullable: true, description: 仅 comparable=true 时有值 }
              lowest_supplier_types:
                type: array
                description: 最低价供应商的类型集合（回答「最低价是线上还是线下」）
                items: { type: string, enum: [online, factory, rental, freelancer, internal] }
              rows:
                type: array
                items:
                  type: object
                  properties:
                    price_id: { type: string, format: uuid }
                    supplier_id: { type: string, format: uuid }
                    supplier_name: { type: string }
                    supplier_type: { type: string, enum: [online, factory, rental, freelancer, internal] }
                    unit_code: { type: string }
                    base_unit_qty:
                      type: string
                      nullable: true
                      description: 1 个比价基准单位 = N 个本价格单位；null = 未填（不可折算）
                    qty_priced: { type: string, description: = qty × COALESCE(base_unit_qty, 1) }
                    tier_min_qty: { type: string, nullable: true }
                    tier_unit_price: { type: string }
                    tiers:
                      type: array
                      description: |
                        **该行全部阶梯，必须整组返回**。数量档切换是比价页最高频交互（compare_qty_switched），
                        每次切档都发请求会让首屏 1.5s 目标失守。服务端算好折算后的价格，前端本地按 qty 命中。
                      items:
                        type: object
                        properties:
                          min_qty: { type: string }
                          max_qty: { type: string, nullable: true, description: 派生 = 下一档 min_qty - 1；null 表示无上限，不入库 }
                          unit_price: { type: string, description: 以本价格计价单位计 }
                          base_unit_price: { type: string, description: 已折算（unit_price × base_unit_qty） }
                    base_unit_price:
                      type: string
                      description: 已折算（unit_price × base_unit_qty）。**compare_state=not_comparable 时该值无业务含义，前端不得展示**
                    compare_state: { $ref: '#/components/schemas/CompareState' }
                    is_lowest: { type: boolean, description: 同一 nature、同一税口径、可比较行内并列最低时为 true }
                    tax_included: { type: boolean }
                    effective_state: { $ref: '#/components/schemas/PriceEffectiveState' }
                    staleness_days: { type: integer, description: 距 max(updated_at, last_used_at) 的天数 }
                    moq: { type: string, nullable: true }
                    effective_from: { type: string, format: date }
                    effective_to: { type: string, format: date, nullable: true }
                    default_lead_time_days: { type: integer, nullable: true }
                    source_note: { type: string, nullable: true }
        missing_suppliers:
          type: array
          description: 该主体有历史报价但当日无有效价的供应商（不参与比价；与「有价但不可比」是两件事）
          items:
            type: object
            properties:
              supplier_id: { type: string, format: uuid }
              supplier_name: { type: string }
              supplier_type: { type: string, enum: [online, factory, rental, freelancer, internal] }
              reason: { type: string, enum: [NO_VALID_PRICE], example: NO_VALID_PRICE }

    PricingNature:
      type: string
      enum: [purchase, rental_per_day, custom_made, service]
      description: |
        交易性质。purchase=买断 / rental_per_day=按天租赁 / custom_made=定制加工 / service=服务（人员专用）。
        最低价只在同一性质内比较。
        service 不是"给人员加个分类"，而是让约束重新有效：该列进 EXCLUDE 唯一键，若人员取 NULL，
        则 WITH = 对 NULL 比较恒为假，约束对人员整段静默失效（同一讲师可插入两条相同按天价，取价不可预期）。
        人员恒取 service，表单不出现该选择；物料的预填值来自 categories.default_pricing_nature。

    CompareState:
      type: string
      enum: [comparable, converted, not_comparable]
      description: |
        comparable=单位与比价基准一致，可直接比；
        converted=单位不一致但填了 base_unit_qty，已折算；
        not_comparable=单位不一致且未填系数，**不参与标最低，但仍可见、仍可加入报价单**

    PriceEffectiveState:
      type: string
      enum: [valid, soft_stale, hard_expired, superseded, archived]
      description: 派生状态，不落库。valid=有效 / soft_stale=软陈旧（仍参与比价与出单，仅提醒）/ hard_expired=硬失效（不参与比价）/ superseded=被替代 / archived=已作废

    PriceTrend:
      type: object
      properties:
        item_id: { type: string, format: uuid }
        item_name: { type: string }
        base_unit_code: { type: string }
        series:
          type: array
          items:
            type: object
            properties:
              supplier_id: { type: string, format: uuid }
              supplier_name: { type: string }
              supplier_type: { type: string, enum: [online, factory, rental, freelancer, internal] }
              points:
                type: array
                items:
                  type: object
                  properties:
                    effective_from: { type: string, format: date }
                    effective_to: { type: string, format: date, nullable: true }
                    tier_min_qty: { type: string, nullable: true }
                    tier_unit_price: { type: string }
                    base_unit_price: { type: string }
                    unit_code: { type: string }

    QuoteCreateInput:
      type: object
      required: [customer_name, event_name, valid_until]
      properties:
        customer_name: { type: string, minLength: 1, maxLength: 80 }
        event_name: { type: string, minLength: 1, maxLength: 120 }
        event_date: { type: string, format: date, nullable: true }
        project_type:
          type: string
          enum: [annual_meeting, product_launch, exhibition_booth, roadshow, framework_client]
          nullable: true
          description: |
            项目类型。空时毛利预警回退全局默认阈值（app_settings.default_margin_threshold）。
            非空时按 margin_thresholds 表取该类型的 warn_rate。
            **预警只影响展示与 risk-check R1，任何情况下不拦截 issue。**
        valid_until: { type: string, format: date }
        target_margin_rate:
          type: string
          nullable: true
          description: 整单目标毛利率（如 "0.4"），用于反推对客价：sale = cost / (1 - rate)
        discount_amount: { type: string, default: '0', description: 整单优惠，正数表示减免 }
        note: { type: string, nullable: true, maxLength: 2000, description: 报价说明 / 条款 }
        tax_statement:
          type: string
          enum: [inclusive, exclusive]
          description: |
            **创建时该字段被忽略**：服务端显式从 `app_settings.tax_statement_default` 复制到 `quotes.tax_statement`
            （`quotes.tax_statement` 列无默认值，见 ARCHITECTURE §6.9 第 5 处修复）。
            **`PATCH /quotes/{id}` 时用于切换口径**：前端必须先调 `POST /quotes/{id}/tax-basis/preview` 展示
            「切换前后整单合计 + 哪些行会变 + 哪些行会缺价」的确认框，用户确认后再提交本字段。
            服务端落库复用同一个 `planTaxBasisSwitch()`，保证提示中的合计与实际落库一致。

    QuoteUpdate:
      type: object
      description: |
        `PATCH /quotes/{id}` 的部分更新体。**与 QuoteCreateInput 分开定义**，因为创建有三项必填、
        更新是"传什么改什么"，合并成一个 schema 会让"PATCH 少传 customer_name 是否合法"这个问题
        只能靠代码判断，而 schema 本来能直接说清。
        `issued` / `void` 态仅允许改 `note`，其余字段提交返回 409 40905。
      properties:
        customer_name: { type: string, minLength: 1, maxLength: 80 }
        event_name: { type: string, minLength: 1, maxLength: 120 }
        event_date: { type: string, format: date, nullable: true }
        project_type:
          type: string
          enum: [annual_meeting, product_launch, exhibition_booth, roadshow, framework_client]
          nullable: true
          description: 传 null 表示清空（清空后毛利预警回退 app_settings.default_margin_threshold）
        valid_until: { type: string, format: date }
        target_margin_rate: { type: string, nullable: true }
        discount_amount: { type: string }
        note: { type: string, nullable: true, maxLength: 2000 }
        tax_statement:
          type: string
          enum: [inclusive, exclusive]
          description: |
            切换口径。**前端必须先调 `POST /quotes/{id}/tax-basis/preview` 并展示切换前后整单合计**，
            用户确认后再提交本字段；服务端落库复用 `planTaxBasisSwitch()`，
            保证提示里的合计与实际落库一致（两个入口各调一次 resolvePrice 就是两份逻辑）。

    QuoteTotals:
      type: object
      properties:
        total_cost: { type: string }
        total_price: { type: string }
        discount_amount: { type: string }
        total_profit: { type: string }
        margin_rate: { type: string }
        min_line_margin: { type: string, nullable: true }

    QuoteListItem:
      allOf:
        - $ref: '#/components/schemas/QuoteTotals'
        - type: object
          properties:
            id: { type: string, format: uuid }
            quote_no: { type: string, example: Q261104-01 }
            version: { type: integer }
            customer_name: { type: string }
            event_name: { type: string }
            event_date: { type: string, format: date, nullable: true }
            project_type:
              type: string
              enum: [annual_meeting, product_launch, exhibition_booth, roadshow, framework_client]
              nullable: true
            warn_rate_used:
              type: string
              nullable: true
              description: |
                本单实际生效的毛利预警线（项目类型阈值或全局默认）。
                必须返回——否则用户看到"低于 30%"却不知道自己配的是 0.25 还是 0.30。
            warn_rate_source:
              type: string
              enum: [project_type, global_default]
              description: warn_rate_used 的来源，用于界面标注「按项目类型」还是「按全局默认」
            valid_until: { type: string, format: date }
            status: { type: string, enum: [draft, issued, void] }
            is_expired: { type: boolean, description: 派生：valid_until < 今天 且 status=issued }
            item_count: { type: integer }
            created_by_name: { type: string, nullable: true }
            created_at: { type: string, format: date-time }
            issued_at: { type: string, format: date-time, nullable: true }

    QuoteDetail:
      allOf:
        - $ref: '#/components/schemas/QuoteListItem'
        - type: object
          properties:
            derived_from_quote_id: { type: string, format: uuid, nullable: true }
            target_margin_rate: { type: string, nullable: true }
            currency: { type: string }
            tax_statement:
              type: string
              enum: [inclusive, exclusive]
              description: |
                口径声明（快照）。创建时从 app_settings.tax_statement_default 复制，出单前可改。
                **存英文码不存中文**：它同时是 resolvePrice 的 tax_basis 入参，同名同值域直接透传，零映射；
                中文「含税/不含税」只做展示。打印/导出为独立一行文字；**不做双口径导出**（PRD §6.6.9）
            note: { type: string, nullable: true }
            updated_at: { type: string, format: date-time }
            items:
              type: array
              items: { $ref: '#/components/schemas/QuoteItem' }

    QuoteItemInput:
      type: object
      required: [line_kind, item_name_snapshot, unit_snapshot, qty, cost_source]
      properties:
        line_kind: { type: string, enum: [material, personnel, custom] }
        pricing_nature:
          type: string
          enum: [purchase, rental_per_day, custom_made, service]
          nullable: true
          description: 本行采用的交易性质快照。`line_kind=custom`（自定义行）时可为 null。用于打印分组与 risk-check R3 的同性质比价
        sort_order: { type: integer }
        item_name_snapshot: { type: string, minLength: 1, maxLength: 80, description: 快照，不随后续改名变化 }
        spec_snapshot: { type: string, nullable: true, maxLength: 200 }
        category_snapshot: { type: string, nullable: true, maxLength: 30 }
        unit_snapshot: { type: string, minLength: 1, maxLength: 20 }
        qty: { type: string, description: 数量，比价基准单位。> 0 }
        cost_unit_price:
          type: string
          description: |
            成本单价，比价基准单位。
            `cost_source=manual`（无有效价、成本手填）时**必填**，缺失返回 40002 MANUAL_COST_REQUIRED；
            `cost_source=price_book` 时省略可由 price_id 的服务端取值填充。
        cost_source:
          type: string
          enum: [price_book, manual]
          description: |
            成本来源。**必传，无默认值**（ARCHITECTURE §6.9 第 3 处修复）——省略即 400。
            理由：省略时若默认成 price_book，这行的成本会被宣称"来自价格库"，而它可能是人填的；
            manual_cost_line_ratio 这个质量指标从此永久失真，且失真方向是"看起来价格库用得比实际好"。
        reference_lowest_price:
          type: string
          nullable: true
          description: 快照：录单那一刻该主体同性质同口径下的最低有效价。`cost_source=manual` 时也应尽量填
        reference_lowest_supplier_id:
          type: string
          format: uuid
          nullable: true
          description: 快照：该最低价对应的供应商。与 supplier_id（实际采用）并存，构成「本可选 X 家、实际选了 Y 家」的完整对照
        sale_unit_price:
          type: string
          description: 对客单价，比价基准单位。不传时按报价单 target_margin_rate 反推（若无目标毛利率则 400）
        item_id: { type: string, format: uuid, nullable: true }
        supplier_id: { type: string, format: uuid, nullable: true }
        supplier_name_snapshot: { type: string, nullable: true, maxLength: 80 }
        price_id: { type: string, format: uuid, nullable: true }
        source_tier_min_qty: { type: string, nullable: true }
        price_effective_from: { type: string, format: date, nullable: true }
        price_effective_to: { type: string, format: date, nullable: true }
        is_visible_to_customer: { type: boolean, default: true }
        remark: { type: string, nullable: true, maxLength: 300 }

    QuoteItem:
      allOf:
        - $ref: '#/components/schemas/QuoteItemInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            quote_id: { type: string, format: uuid }
            line_cost: { type: string, description: 服务端计算 = round(qty × cost_unit_price, 2) }
            line_price: { type: string, description: 服务端计算 = round(qty × sale_unit_price, 2) }
            line_profit: { type: string }
            line_margin: { type: string }
            price_missing:
              type: boolean
              readOnly: true
              description: |
                **GENERATED 列，只读，不会被写入**：= (cost_source = 'manual' AND price_id IS NULL)。
                ARCHITECTURE §6.9 第 4 处：它与这两个源字段是同一个事实，做成可写就多一条会不一致的同步路径。
                语义 = "这行的成本没有价格库支撑，必须有人复核"。无有效价、成本手填时置 true（PRD §7.3 标红）

    TaxBasisPreviewRequest:
      type: object
      required: [tax_statement]
      properties:
        tax_statement:
          type: string
          enum: [inclusive, exclusive]
          description: 目标口径。与 resolvePrice 的 tax_basis 同名同值域，零映射

    TaxBasisPreviewLine:
      type: object
      description: 一行在切换口径前后的对照。只包含会发生变化的行与会变缺价的行
      properties:
        line_id: { type: string, format: uuid }
        item_name_snapshot: { type: string }
        supplier_name_snapshot: { type: string, nullable: true }
        pricing_mode:
          type: string
          enum: [auto, manual]
          description: |
            auto = 该行成本由价格库自动取得（cost_source=price_book），切口径后会换价；
            manual = 该行成本人工给定（cost_source=manual），切口径后只有毛利变、对客价不动。
        old_cost: { type: string, description: 切换前成本单价（比价基准单位） }
        new_cost:
          type: string
          nullable: true
          description: 切换后成本单价；will_be_missing=true 时为 null（前端显示「切换后将缺价」而不是 0）
        old_sale: { type: string }
        new_sale:
          type: string
          description: |
            auto 行 = 按报价单目标毛利率反推的新对客价；manual 行与缺价行 = **与 old_sale 相同**。
            缺价行保持原值是硬规则（PRD v1.7 §6.6.9.2）。
        will_be_missing: { type: boolean, description: 新口径下该主体无有效价，切换后该行成本需人工复核 }
        old_price_id: { type: string, format: uuid, nullable: true }
        new_price_id: { type: string, format: uuid, nullable: true, description: will_be_missing=true 时为 null }

    TaxBasisPreviewSummary:
      type: object
      properties:
        total_before: { type: string, description: "当前整单合计（含 discount_amount），与 GET /quotes/{id} 的 total_price 减 discount 一致" }
        total_after: { type: string, description: "切换后整单合计，算法与 recalculate/issue 完全相同（同一函数）。缺价行按原对客价计入" }
        changed_lines: { type: integer, description: 成本发生变化的行数 }
        auto_priced_lines: { type: integer }
        manual_priced_lines: { type: integer }
        missing_after: { type: integer, description: 切换后会变成缺价的行数。>0 时前端必须逐行列出，不能只给一个数字 }

    TaxBasisPreviewResponse:
      type: object
      properties:
        affected_lines:
          type: array
          items: { $ref: '#/components/schemas/TaxBasisPreviewLine' }
        summary: { $ref: '#/components/schemas/TaxBasisPreviewSummary' }

    RiskCheckResult:
      type: object
      properties:
        price_expiring:
          type: array
          description: 引用的价格在报价有效期内就失效了
          items:
            type: object
            properties:
              item_id: { type: string, format: uuid }
              item_name_snapshot: { type: string }
              supplier_name_snapshot: { type: string, nullable: true }
              effective_to: { type: string, format: date }
        negative_margin_items:
          type: array
          description: 亏损行
          items:
            type: object
            properties:
              item_id: { type: string, format: uuid }
              item_name_snapshot: { type: string }
              line_price: { type: string }
              line_cost: { type: string }
              line_profit: { type: string }
        zero_price_items:
          type: array
          description: 单价为 0 或成本为手填（price_missing=true）
          items:
            type: object
            properties:
              item_id: { type: string, format: uuid }
              item_name_snapshot: { type: string }
              price_missing: { type: boolean }
        stale_draft_items:
          type: array
          description: 草稿中引用的价格已被新价取代
          items:
            type: object
            properties:
              item_id: { type: string, format: uuid }
              item_name_snapshot: { type: string }
              snapshot_price: { type: string }
              latest_price: { type: string, nullable: true }
        valid_until_passed: { type: boolean }

    QuoteSummary:
      type: object
      properties:
        quote_count: { type: integer }
        total_price: { type: string }
        total_profit: { type: string }
        avg_margin_rate: { type: string }
        by_status:
          type: object
          additionalProperties: { type: integer }
        by_project_type:
          type: array
          description: 按项目类型分组的毛利统计（project_type 为 null 的单归入 project_type=null 一组）
          items:
            type: object
            properties:
              project_type:
                type: string
                enum: [annual_meeting, product_launch, exhibition_booth, roadshow, framework_client]
                nullable: true
              quote_count: { type: integer }
              total_price: { type: string }
              total_profit: { type: string }
              avg_margin_rate: { type: string }
              warn_rate: { type: string, description: 该类型的预警线（取自 margin_thresholds，null 组取全局默认） }
              below_warn_count: { type: integer, description: 低于预警线的单数 }
        top_customers:
          type: array
          items:
            type: object
            properties:
              customer_name: { type: string }
              quote_count: { type: integer }
              total_price: { type: string }

    DashboardSummary:
      type: object
      properties:
        material_count: { type: integer }
        personnel_count: { type: integer }
        supplier_count: { type: integer }
        price_count: { type: integer }
        expiring_price_count: { type: integer }
        draft_quote_count: { type: integer }
        month_quote_total: { type: string }
        recent_quotes:
          type: array
          items: { $ref: '#/components/schemas/QuoteListItem' }
        unread_notification_count: { type: integer }
        stale_price_count: { type: integer, description: 软陈旧价格数（仍可用，仅提醒） }
        manual_cost_line_ratio: { type: string, description: 质量指标：手填成本行数 / 总行数（近 4 周） }
        has_overdue_price: { type: boolean, description: 硬红线：是否存在 cost_source=price_book 且价格在出单前已硬失效的行。正常应为 false，为 true 即打告警日志 }
        recent_price_changes:
          type: array
          description: 成员最近改价清单（只可见、不阻断）。与「发送前自检 + 出单通知」同一思路：给管理员可见性，不给门禁
          items:
            type: object
            properties:
              price_id: { type: string, format: uuid }
              item_name: { type: string }
              supplier_name: { type: string }
              action: { type: string, enum: [created, superseded, archived] }
              changed_by_name: { type: string, nullable: true }
              changed_at: { type: string, format: date-time }
              is_overwrite: { type: boolean, description: true 表示覆盖了已有价（推荐策略下只有 admin 能做） }

    CompanyProfile:
      type: object
      properties:
        name: { type: string, maxLength: 100 }
        address: { type: string, nullable: true, maxLength: 200 }
        phone: { type: string, nullable: true, maxLength: 40 }
        email: { type: string, nullable: true, maxLength: 100 }
        tax_no: { type: string, nullable: true, maxLength: 40 }
        bank_info: { type: string, nullable: true, maxLength: 200 }
        logo_url: { type: string, nullable: true }

    QuoteSettings:
      type: object
      properties:
        stale_days_threshold:
          type: integer
          minimum: 1
          default: 90
          description: 软陈旧阈值（天）。距 max(updated_at, last_used_at) 超过此值即为软陈旧——仍参与比价与出单，仅提醒
        default_margin_threshold:
          type: string
          default: '0.25'
          description: |
            整单毛利率预警阈值的**全局默认值**（0-1 小数）。
            具体某一单：先按 quotes.project_type 查 margin_thresholds，查不到才回退本值。
            **必须可配，禁止硬编码。预警只影响展示与 risk-check R1，任何情况下不拦截 issue。**
        margin_thresholds:
          type: array
          description: |
            按项目类型的预警线（总监 Q3）。**占位默认值必须可配，不得写进代码**。
            PATCH 时传整个数组覆盖（不做增量合并，避免"少传一个就被默认值悄悄改回去"）。
          items:
            type: object
            required: [project_type, warn_rate]
            properties:
              project_type:
                type: string
                enum: [annual_meeting, product_launch, exhibition_booth, roadshow, framework_client]
              label: { type: string, description: 中文名（年会/庆典、品牌发布会、展台特装、路演/地推、长期框架客户） }
              warn_rate: { type: string, description: 0-1 小数，CHECK (0,1) 开区间 }
        tax_statement_default:
          type: string
          enum: [inclusive, exclusive]
          default: inclusive
          description: 新建报价单时的默认口径声明，复制到 quotes.tax_statement 后两者独立。与比价/取价的 tax_basis 同值域，零映射
        default_terms: { type: string, nullable: true, maxLength: 2000, description: 报价单默认条款文案 }

    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [quote_issued, price_stale, price_expiring] }
        title: { type: string, example: 报价单 Q261104-03 已发出 }
        body: { type: string, nullable: true, example: '客户：某某品牌；金额 5,040.00；毛利率 40.0%' }
        ref_type: { type: string, nullable: true, enum: [quote, price, null] }
        ref_id: { type: string, format: uuid, nullable: true, description: 引用对象；对象被硬删后仍可读，title/body 自足 }
        read_at: { type: string, format: date-time, nullable: true, description: null = 未读 }
        created_at: { type: string, format: date-time }
