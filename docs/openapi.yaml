openapi: 3.0.3

info:
  title: 活动物料与人员价格库 API
  version: 1.0.0
  description: |
    活动策划公司内部价格库与报价单系统的 REST 契约。与 `docs/02-ARCHITECTURE.md` v1.0 配套，二者冲突时以架构文档为准。

    ## 通用约定
    - 所有端点位于 `/api/v1/` 下。
    - 认证：`Cookie: rc_session=<JWT>`（httpOnly）。除 `POST /auth/login` 与 `GET /health` 外均需登录。
    - 响应统一信封 `{ code, data, message }`，`code = 0` 为成功。
    - 金额：JSON 中一律以**字符串**传输（如 `"1234.5600"`），避免 JS 双精度丢精度。
    - 日期：`YYYY-MM-DD`；时间戳：ISO 8601 带时区。
    - 分页：`page`（默认 1）、`limit`（默认 20，上限 100）。响应 `data: { items, total, page, limit, hasMore }`。
    - 计价主体（物料与人员）统一在 `/items` 资源下，用 `item_type` 区分。分类统一在 `/categories` 下，用 `domain` 区分两棵树。
    - PDF 不在本契约内：由页面 `/quotes/{id}/print?view=customer|internal` 提供，用户用浏览器打印为 PDF。客户版由服务端在取数阶段裁掉成本字段。

servers:
  - url: /api/v1
    description: 同源部署（推荐）

tags:
  - name: auth
    description: 认证
  - name: users
    description: 账号管理（仅 admin）
  - name: suppliers
    description: 供应商
  - name: categories
    description: 分类（material / personnel 双域）
  - name: items
    description: 计价主体（物料 + 人员）
  - name: units
    description: 单位字典
  - name: prices
    description: 价格条目（版本化）
  - name: lookup
    description: 取价 / 比价 / 趋势
  - name: quotes
    description: 报价单
  - name: system
    description: 工作台与系统设置
  - name: notifications
    description: 站内通知（出单通知）

security:
  - sessionCookie: []

paths:
  # ─────────────────────────── auth ───────────────────────────
  /auth/login:
    post:
      tags: [auth]
      summary: 登录（下发 httpOnly Cookie）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 1 }
      responses:
        '200':
          description: 登录成功，Set-Cookie 写入 rc_session
          headers:
            Set-Cookie:
              schema: { type: string }
              description: rc_session=<jwt>; HttpOnly; Secure; SameSite=Lax; Path=/; Max-Age=259200
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/logout:
    post:
      tags: [auth]
      summary: 退出登录（清 Cookie）
      responses:
        '200': { $ref: '#/components/responses/OkNull' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout-all:
    post:
      tags: [auth]
      summary: 退出所有设备（递增 token_version，全部已签发 JWT 立即失效）
      responses:
        '200': { $ref: '#/components/responses/OkNull' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/me:
    get:
      tags: [auth]
      summary: 当前登录用户
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/password:
    patch:
      tags: [auth]
      summary: 修改自己的密码（成功后 token_version 递增，需重新登录）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password:
                  type: string
                  minLength: 10
                  description: 长度 ≥ 10，不得与邮箱相同。不强制大小写/符号组合
      responses:
        '200': { $ref: '#/components/responses/OkNull' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ─────────────────────────── users ───────────────────────────
  /users:
    get:
      tags: [users]
      summary: 用户列表（仅 admin）
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: role, in: query, schema: { type: string, enum: [admin, member] } }
        - { name: is_active, in: query, schema: { type: boolean } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/Pagination'
                          - type: object
                            properties:
                              items:
                                type: array
                                items: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [users]
      summary: 新建用户（仅 admin）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, display_name, password, role]
              properties:
                email: { type: string, format: email }
                display_name: { type: string, minLength: 1, maxLength: 40 }
                password: { type: string, minLength: 10 }
                role: { type: string, enum: [admin, member] }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [users]
      summary: 修改用户（资料 / 角色 / 停用 / 重置密码）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: { type: string, minLength: 1, maxLength: 40 }
                role: { type: string, enum: [admin, member] }
                is_active: { type: boolean }
                password: { type: string, minLength: 10 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [users]
      summary: 停用用户（软删除）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          is_active: { type: boolean, enum: [false] }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 40904 不能停用自己或最后一个 admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  # ─────────────────────────── suppliers ───────────────────────────
  /suppliers:
    get:
      tags: [suppliers]
      summary: 供应商列表（含类型筛选）
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - name: type
          in: query
          description: online 线上电商 / factory 线下定做厂 / rental 租赁商 / freelancer 个人兼职 / internal 自有人员
          schema: { type: string, enum: [online, factory, rental, freelancer, internal] }
        - { name: is_active, in: query, schema: { type: boolean } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/Pagination'
                          - type: object
                            properties:
                              items:
                                type: array
                                items: { $ref: '#/components/schemas/Supplier' }
    post:
      tags: [suppliers]
      summary: 新建供应商（仅 admin）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplierInput' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Supplier' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /suppliers/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [suppliers]
      summary: 供应商详情（含引用统计）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/Supplier'
                          - type: object
                            properties:
                              price_count: { type: integer }
                              item_count: { type: integer }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [suppliers]
      summary: 修改供应商（仅 admin）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplierInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Supplier' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [suppliers]
      summary: 删除供应商（有价格记录时 40904）
      responses:
        '200': { $ref: '#/components/responses/OkNull' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ─────────────────────────── categories ───────────────────────────
  /categories:
    get:
      tags: [categories]
      summary: 分类树（两域一起返回）
      parameters:
        - name: domain
          in: query
          description: 不传返回两棵树全部
          schema: { type: string, enum: [material, personnel] }
        - { name: include_counts, in: query, schema: { type: boolean, default: true } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/CategoryNode' }
    post:
      tags: [categories]
      summary: 新建分类（仅 admin）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain, name]
              properties:
                domain: { type: string, enum: [material, personnel] }
                name: { type: string, minLength: 1, maxLength: 30 }
                parent_id: { type: string, format: uuid, nullable: true }
                sort_order: { type: integer, default: 0 }
                default_pricing_nature:
                  type: string
                  enum: [purchase, rental_per_day, custom_made]
                  nullable: true
                  description: |
                    该分类下录价时**交易性质的表单预填值**（总监 Q2 裁决）。
                    解析顺序：本节点 → 父节点（两级树，最多上溯一次）→ purchase。
                    **只做预填，不参与任何计算**：不进 prices 的 EXCLUDE 唯一键、不进 resolvePrice 的候选集过滤、不进比价分组。
                    prices.pricing_nature 列本身无默认值，写库必须显式传（ARCHITECTURE §6.9 第 2 处）。
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: 42206 超过两级，或子节点 domain 与父节点不一致
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /categories/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [categories]
      summary: 修改分类（改名 / 改父 / 改序；改父会检查成环与跨域）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 30 }
                parent_id: { type: string, format: uuid, nullable: true }
                sort_order: { type: integer }
                default_pricing_nature:
                  type: string
                  enum: [purchase, rental_per_day, custom_made]
                  nullable: true
                  description: 传 null 表示清空（清空后回退父节点，再回退 purchase）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: 42206 超过两级，或跨域移动
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    delete:
      tags: [categories]
      summary: 删除分类（有子节点或主体时 40904）
      responses:
        '200': { $ref: '#/components/responses/OkNull' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ─────────────────────────── items ───────────────────────────
  /items:
    get:
      tags: [items]
      summary: 主体列表（物料 + 人员，含搜索、分类筛选、底价摘要）
      parameters:
        - { name: item_type, in: query, schema: { type: string, enum: [material, personnel] } }
        - { name: q, in: query, schema: { type: string }, description: 匹配名称或规格（pg_trgm） }
        - { name: category_id, in: query, schema: { type: string, format: uuid } }
        - { name: supplier_id, in: query, schema: { type: string, format: uuid }, description: 仅返回该供应商有报价的主体 }
        - { name: is_active, in: query, schema: { type: boolean, default: true } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/Pagination'
                          - type: object
                            properties:
                              items:
                                type: array
                                items: { $ref: '#/components/schemas/ItemListItem' }
    post:
      tags: [items]
      summary: 新建主体（仅 admin）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ItemInput' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Item' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: 42206 category 的 domain 与 item_type 不匹配
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /items/search-lite:
    get:
      tags: [items]
      summary: 轻量搜索（拼单下拉用）
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: item_type, in: query, schema: { type: string, enum: [material, personnel] } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 50 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ItemLite' }

  /items/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [items]
      summary: 主体详情（含图片、外链、价格摘要）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ItemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [items]
      summary: 修改主体（已有价格时禁止改 base_unit_code，返回 42204）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ItemInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Item' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: 42204 已有价格记录，不可修改基准单位
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    delete:
      tags: [items]
      summary: 停用主体（软删除）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          is_active: { type: boolean, enum: [false] }
        '404': { $ref: '#/components/responses/NotFound' }

  /items/{id}/images:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [items]
      summary: 上传参考图 / PDF（仅 admin）
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: image/jpeg、image/png、image/webp、application/pdf，≤ 5MB。服务端按魔数校验真实类型，不信任 Content-Type
                sort_order: { type: integer, default: 0 }
      responses:
        '201':
          description: 已上传（图片会生成 480px 缩略图）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Attachment' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413':
          description: 41301 文件过大（> 5MB）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '415':
          description: 41501 文件类型不支持
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /items/{id}/images/{imageId}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: imageId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [items]
      summary: 调整附件顺序
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sort_order]
              properties:
                sort_order: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Attachment' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [items]
      summary: 删除附件（先删 DB 行，物理文件由周清理任务回收）
      responses:
        '200': { $ref: '#/components/responses/OkNull' }
        '404': { $ref: '#/components/responses/NotFound' }

  /items/{id}/links:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [items]
      summary: 新增外部链接（淘宝 / 1688 等；只存 URL，不服务端抓取、不内嵌 iframe）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label, url]
              properties:
                label: { type: string, minLength: 1, maxLength: 60 }
                url: { type: string, pattern: '^https?://.+', maxLength: 1000 }
                platform: { type: string, enum: [taobao, alibaba, offline, other], nullable: true }
                note: { type: string, maxLength: 200, nullable: true }
                sort_order: { type: integer, default: 0 }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ItemLink' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /items/{id}/links/{linkId}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: linkId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [items]
      summary: 修改外链
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string, minLength: 1, maxLength: 60 }
                url: { type: string, pattern: '^https?://.+' }
                platform: { type: string, enum: [taobao, alibaba, offline, other], nullable: true }
                note: { type: string, nullable: true }
                sort_order: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ItemLink' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [items]
      summary: 删除外链
      responses:
        '200': { $ref: '#/components/responses/OkNull' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────────── units ───────────────────────────
  /units:
    get:
      tags: [units]
      summary: 单位字典（只读种子数据）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Unit' }

  # ─────────────────────────── prices ───────────────────────────
  /prices:
    get:
      tags: [prices]
      summary: 价格条目列表
      parameters:
        - { name: item_id, in: query, schema: { type: string, format: uuid } }
        - { name: supplier_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [active, superseded, archived] } }
        - { name: from, in: query, schema: { type: string, format: date }, description: 只看在此日期之后生效的 }
        - { name: to, in: query, schema: { type: string, format: date } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/Pagination'
                          - type: object
                            properties:
                              items:
                                type: array
                                items: { $ref: '#/components/schemas/Price' }
    post:
      tags: [prices]
      summary: 新建价格条目（含阶梯）— admin 与 member 均可（R15 分层开放）
      description: |
        权限：`canCreatePrice(role)` 放行 admin 与 member。**这与"能不能改价"是两个判定，不得合并**。

        调价的正确做法是调用本端点新建一条记录，并置 `close_previous=true` 让服务端在同一事务内把旧记录的 `effective_to` 关闭为「新价生效日 - 1 天」、`status` 置为 `superseded`。

        **不允许**用 PATCH 改已有记录的金额（40903 PRICE_IMMUTABLE）。

        生效期间重叠会被数据库 EXCLUDE 约束拦截并返回 40902，响应体含 `proposed_close` 供前端弹出确认。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PriceInput' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/Price'
                          - type: object
                            properties:
                              previous_closed_id:
                                type: string
                                format: uuid
                                nullable: true
                                description: close_previous=true 时被关闭的旧记录 id
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            40902 PRICE_PERIOD_OVERLAP — 同供应商同主体的生效期间重叠。响应体含 `proposed_close`。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422':
          description: |
            42201 BASE_UNIT_QTY_INVALID — unit_code 与主体 compare_unit_code 不同时，
                  base_unit_qty 允许为空，但一旦填写必须 > 0 且 ≠ 1（填 1 等于谎称单位一致）。
            42202 TIER_INVALID — 同一请求中 min_qty 重复。
            42207 IMMUTABLE_FIELDS_CHANGED — 见 close_previous 说明：
                  ① close_previous=true 但按请求体的 (item_id, supplier_id, pricing_nature, tax_included, unit_mode)
                     定位不到恰好 1 条当前有效记录；
                  ② base_unit_qty 与将被关闭的旧记录不一致；
                  ③ 请求体出现 id（POST 永远是 INSERT 新 id，不接受"伪装成新建的覆盖"）。
                  这四种字段（supplier_id / unit_code / pricing_nature / base_unit_qty）换了任何一个，
                  被比较的对象就变了：pricing_nature 换了那条价会跳进另一个比价分组，
                  base_unit_qty 换了换算结果直接变。**UI 灰显是体验，接口拒收才是权限边界。**
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /prices/expiring:
    get:
      tags: [prices]
      summary: 即将失效 / 长期未更新（"该跟供应商续价了"提醒）
      parameters:
        - name: mode
          in: query
          description: expiring 按 effective_to 临近；stale 按 updated_at 过久未更新
          schema: { type: string, enum: [expiring, stale], default: expiring }
        - { name: days, in: query, schema: { type: integer, default: 30, minimum: 1, maximum: 365 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ExpiringPrice' }

  /prices/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [prices]
      summary: 价格详情（含阶梯与附件）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Price' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [prices]
      summary: 仅允许改 source_note / moq / 提前 effective_to（调价请新建记录）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                source_note: { type: string, nullable: true, maxLength: 200 }
                moq: { type: string, nullable: true }
                effective_to:
                  type: string
                  format: date
                  nullable: true
                  description: 只能往早改（提前终止），不能晚于原值
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Price' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 40903 PRICE_IMMUTABLE — 试图修改金额 / 单位 / 生效期间等不可变字段
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /prices/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [prices]
      summary: 归档价格（不再参与比价，历史仍可查）— 仅 admin（canOverridePrice）
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 200 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Price' }
        '404': { $ref: '#/components/responses/NotFound' }

  /prices/{id}/history:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [prices]
      summary: 该价格的变更审计（append-only，永久保留）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/PriceChangeLog' }
        '404': { $ref: '#/components/responses/NotFound' }

  /prices/{id}/attachments:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [prices]
      summary: 上传报价截图 / PDF（仅 admin）
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                note: { type: string, maxLength: 200 }
      responses:
        '201':
          description: 已上传
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Attachment' }
        '413':
          description: 41301 文件过大
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '415':
          description: 41501 文件类型不支持
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /prices/{id}/attachments/{attachmentId}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: attachmentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [prices]
      summary: 删除报价附件
      responses:
        '200': { $ref: '#/components/responses/OkNull' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────────── lookup / comparison / trend ───────────────────────────
  /price-lookup:
    get:
      tags: [lookup]
      summary: 单条取价（拼单用）——返回归一化到比价基准单位的单价
      parameters:
        - { name: item_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: qty, in: query, required: true, schema: { type: number, minimum: 0.001 }, description: 数量，以比价基准单位计 }
        - name: pricing_nature
          in: query
          required: true
          description: 交易性质。必须先定性质再取价，跨性质的价格不可比较
          schema: { $ref: '#/components/schemas/PricingNature' }
        - { name: on_date, in: query, schema: { type: string, format: date }, description: 默认今天 }
        - { name: supplier_id, in: query, schema: { type: string, format: uuid }, description: 不传则自动取该性质下当日最低价供应商 }
        - name: tax_basis
          in: query
          required: true
          description: |
            本报价单的口径声明（继承自 quotes.tax_statement），**必传，无默认值、无回落**。
            直接参与候选集过滤：同一供应商可同时有含税与不含税两条价，本单声明什么口径就取哪条。
            **该口径无价时不回退换价**（PRD v1.8 / Q7）：返 42205，错误体 `data` 里带 other_basis_exists + other_basis_price 仅作提示。
            理由：含税单拿到不含税成本会让毛利率 24.7% 虚高成 33.3%，两个数都"看起来正常"。**绝不跨口径换算**
          schema: { type: string, enum: [inclusive, exclusive] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PriceLookupResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: |
            42205 PRICE_NOT_FOUND — 该主体在该供应商、该口径、该日期、该数量下没有有效价格。
            **不用另一口径的价顶替**；`data.other_basis_*` 只作提示，不进任何金额。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriceLookupMiss' }

  /items/{id}/compare:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [lookup]
      summary: 多供应商并排比价（按交易性质分组，组内标最低）
      description: |
        三组分组键依次生效：pricing_nature → tax_included → compare_state。
        - 跨 pricing_nature 不标最低（租价与买断价不可比）
        - 同组内含税/不含税混排 → 该组 comparable=false, reason=MIXED_BASIS + basis_dimension=tax
        - 单位不一致且未填 base_unit_qty 的行 → compare_state=not_comparable，仍返回但不参与标最低
        缺失供应商不放在 groups 里，单独放 missing_suppliers。
      parameters:
        - { name: qty, in: query, required: true, schema: { type: number, minimum: 0.001 } }
        - { name: on_date, in: query, schema: { type: string, format: date } }
        - { name: pricing_nature, in: query, schema: { $ref: '#/components/schemas/PricingNature' }, description: 不传则返回全部分组 }
        - name: tax_basis
          in: query
          description: 本单口径声明。传入时只返回该口径的价并正常标最低；不传则两种口径都返回、该组 comparable=false（reason=MIXED_BASIS + basis_dimension=tax）。**不得把两个口径混在一组里排序**
          schema: { type: string, enum: [inclusive, exclusive] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CompareResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /items/{id}/price-trend:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [lookup]
      summary: 历史价格趋势（按交易性质分组，阶梯线不插值）
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - name: supplier_ids
          in: query
          description: 逗号分隔的供应商 UUID；不传则返回全部
          schema: { type: string }
        - { name: pricing_nature, in: query, schema: { $ref: '#/components/schemas/PricingNature' }, description: 不传则返回全部性质（前端必须分图渲染） }
        - { name: tier_min_qty, in: query, schema: { type: number, default: 1 }, description: 取哪一档画趋势线，默认最低档 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PriceTrend' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────────── quotes ───────────────────────────
  /quotes:
    get:
      tags: [quotes]
      summary: 报价单列表
      parameters:
        - { name: q, in: query, schema: { type: string }, description: 匹配客户名、活动名、单号 }
        - { name: status, in: query, schema: { type: string, enum: [draft, issued, void] } }
        - { name: project_type, in: query, schema: { type: string, enum: [annual_meeting, product_launch, exhibition_booth, roadshow, framework_client] }, description: 台账按项目类型筛选；不传返回全部 }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/Pagination'
                          - type: object
                            properties:
                              items:
                                type: array
                                items: { $ref: '#/components/schemas/QuoteListItem' }
    post:
      tags: [quotes]
      summary: 新建报价单（草稿）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteCreateInput' }
      responses:
        '201':
          description: 已创建（服务端生成 quote_no，如 Q261104-01，version=1）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/QuoteDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422':
          description: 42203 VALID_UNTIL_IN_PAST — 有效期早于今天
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /quotes/summary:
    get:
      tags: [quotes]
      summary: 报价单台账统计
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - name: group_by
          in: query
          description: |
            分组维度。`project_type` 时按项目类型聚合（响应必带 by_project_type）；
            不传则只返回汇总与 by_status。**不要在前端做这个聚合**——它要 JOIN margin_thresholds 才能带出
            每个类型的预警线与低于预警线的单数，前端拿不到阈值表。
          schema: { type: string, enum: [project_type, status] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/QuoteSummary' }

  /quotes/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [quotes]
      summary: 报价单详情（含全部行快照）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/QuoteDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [quotes]
      summary: 修改报价单基础信息
      description: |
        `draft` 态可改全部字段；`issued` / `void` 态仅允许改 `note`。
        状态变更请用 `POST /quotes/{id}/issue` 或 `POST /quotes/{id}/void`。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/QuoteDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 40905 QUOTE_NOT_EDITABLE — 已发出报价单不允许修改该字段
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    delete:
      tags: [quotes]
      summary: 删除报价单（仅 draft 可删，软删除）
      responses:
        '200': { $ref: '#/components/responses/OkNull' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 40905 QUOTE_NOT_EDITABLE — 非草稿状态不可删除
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /quotes/{id}/items:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [quotes]
      summary: 追加报价单行
      description: |
        金额由服务端重新计算后落表，**不信任前端传来的金额**。
        若 `sale_unit_price` 未传且报价单设置了 `target_margin_rate`，服务端按 `sale = cost / (1 - rate)` 反推。
        响应中的 `quote_totals` 是重算后的整单汇总。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteItemInput' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          item: { $ref: '#/components/schemas/QuoteItem' }
                          quote_totals: { $ref: '#/components/schemas/QuoteTotals' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
